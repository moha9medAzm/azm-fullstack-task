version: 1
project:
  name: Customer Support CRM
  primaryLanguage: TypeScript
  projectRoots:
    - .
tracker:
  type: none
naming:
  includeTrackerId: false
  globalSequence: true
agents:
  - claude-code
planner:
  enabled: true
  provider: anthropic
  mode: auto
  budget:
    maxFileReads: 25
    maxContextBytes: 50000
    maxDurationSeconds: 180
  cache:
    enabled: true
  maxOutputTokens: 16384
